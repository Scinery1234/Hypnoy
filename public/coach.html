<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hypnoy — Coaching Companion</title>
    <meta
      name="description"
      content="A holistic therapist-led coaching companion: reduce the charge, CBT, executive function, and inner compass."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg: #f6f1ea;
        --bg-soft: #fbf8f3;
        --ink: #2c2a27;
        --ink-soft: #6b655d;
        --line: #e6ddd0;
        --card: #ffffff;
        --accent: #d08a3e;
        --accent-soft: #f3e4d1;
        --user-bubble: #2c2a27;
        --radius: 18px;
        --shadow: 0 14px 40px -24px rgba(60, 45, 25, 0.5);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(1200px 600px at 15% -10%, #fdf6ea 0%, transparent 55%),
          radial-gradient(1000px 700px at 100% 0%, #f4ece0 0%, transparent 50%),
          var(--bg);
        -webkit-font-smoothing: antialiased;
      }

      .app {
        max-width: 1180px;
        margin: 0 auto;
        min-height: 100%;
        display: flex;
        flex-direction: column;
        padding: 28px 20px 20px;
      }

      /* Header */
      header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 20px;
      }

      .brand h1 {
        font-family: 'Cormorant Garamond', serif;
        font-weight: 600;
        font-size: 34px;
        line-height: 1;
        margin: 0;
        letter-spacing: 0.5px;
      }

      .brand p {
        margin: 6px 0 0;
        color: var(--ink-soft);
        font-size: 14px;
      }

      .disclaimer {
        font-size: 12px;
        color: var(--ink-soft);
        max-width: 340px;
        text-align: right;
        line-height: 1.5;
      }

      /* Layout */
      .layout {
        display: grid;
        grid-template-columns: 300px 1fr;
        gap: 20px;
        flex: 1;
        min-height: 0;
      }

      /* Module rail */
      .modules {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .module-btn {
        text-align: left;
        border: 1px solid var(--line);
        background: var(--card);
        border-radius: var(--radius);
        padding: 16px 16px 15px;
        cursor: pointer;
        transition: transform 0.12s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        display: flex;
        gap: 13px;
        align-items: flex-start;
        font-family: inherit;
        color: inherit;
      }

      .module-btn:hover {
        transform: translateY(-1px);
        box-shadow: var(--shadow);
      }

      .module-btn[aria-pressed='true'] {
        border-color: var(--m-accent);
        box-shadow: 0 0 0 1px var(--m-accent), var(--shadow);
      }

      .module-btn .glyph {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        font-size: 20px;
        background: var(--m-soft);
        flex: none;
      }

      .module-btn .m-name {
        font-weight: 600;
        font-size: 15px;
        margin: 2px 0 3px;
      }

      .module-btn .m-tag {
        font-size: 12.5px;
        color: var(--ink-soft);
        line-height: 1.45;
      }

      /* Chat panel */
      .panel {
        background: var(--bg-soft);
        border: 1px solid var(--line);
        border-radius: 24px;
        display: flex;
        flex-direction: column;
        min-height: 0;
        overflow: hidden;
        box-shadow: var(--shadow);
      }

      .panel-head {
        padding: 18px 22px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 14px;
        background: var(--card);
      }

      .panel-head .glyph {
        width: 44px;
        height: 44px;
        border-radius: 13px;
        display: grid;
        place-items: center;
        font-size: 22px;
        background: var(--accent-soft);
        flex: none;
      }

      .panel-head .p-title {
        font-family: 'Cormorant Garamond', serif;
        font-size: 24px;
        font-weight: 600;
        line-height: 1.1;
      }

      .panel-head .p-tag {
        font-size: 13px;
        color: var(--ink-soft);
        margin-top: 2px;
      }

      .panel-head .spacer {
        flex: 1;
      }

      .reset-btn {
        border: 1px solid var(--line);
        background: transparent;
        color: var(--ink-soft);
        font-family: inherit;
        font-size: 12.5px;
        padding: 8px 12px;
        border-radius: 999px;
        cursor: pointer;
        transition: color 0.2s, border-color 0.2s;
      }

      .reset-btn:hover {
        color: var(--ink);
        border-color: var(--ink-soft);
      }

      /* Messages */
      .messages {
        flex: 1;
        overflow-y: auto;
        padding: 24px 22px 8px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        scroll-behavior: smooth;
      }

      .msg {
        max-width: 78%;
        padding: 13px 16px;
        border-radius: 16px;
        font-size: 15px;
        line-height: 1.6;
        white-space: normal;
        word-wrap: break-word;
      }

      .msg.assistant {
        align-self: flex-start;
        background: var(--card);
        border: 1px solid var(--line);
        border-bottom-left-radius: 5px;
      }

      .msg.user {
        align-self: flex-end;
        background: var(--user-bubble);
        color: #f6f1ea;
        border-bottom-right-radius: 5px;
      }

      .msg p {
        margin: 0 0 8px;
      }
      .msg p:last-child {
        margin-bottom: 0;
      }
      .msg strong {
        font-weight: 600;
      }
      .msg ul {
        margin: 6px 0;
        padding-left: 20px;
      }

      .typing {
        align-self: flex-start;
        background: var(--card);
        border: 1px solid var(--line);
        border-bottom-left-radius: 5px;
        padding: 15px 18px;
        border-radius: 16px;
        display: inline-flex;
        gap: 5px;
      }

      .typing span {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--m-accent, var(--accent));
        opacity: 0.5;
        animation: bounce 1.3s infinite ease-in-out;
      }
      .typing span:nth-child(2) {
        animation-delay: 0.18s;
      }
      .typing span:nth-child(3) {
        animation-delay: 0.36s;
      }

      @keyframes bounce {
        0%,
        60%,
        100% {
          transform: translateY(0);
          opacity: 0.4;
        }
        30% {
          transform: translateY(-5px);
          opacity: 0.9;
        }
      }

      /* Composer */
      .composer {
        padding: 14px 16px 16px;
        border-top: 1px solid var(--line);
        background: var(--card);
        display: flex;
        gap: 10px;
        align-items: flex-end;
      }

      .composer textarea {
        flex: 1;
        resize: none;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px 14px;
        font-family: inherit;
        font-size: 15px;
        line-height: 1.5;
        color: var(--ink);
        background: var(--bg-soft);
        max-height: 160px;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
      }

      .composer textarea:focus {
        border-color: var(--m-accent, var(--accent));
        box-shadow: 0 0 0 3px var(--m-soft, var(--accent-soft));
      }

      .send-btn {
        flex: none;
        border: none;
        cursor: pointer;
        width: 46px;
        height: 46px;
        border-radius: 14px;
        background: var(--m-accent, var(--accent));
        color: #fff;
        display: grid;
        place-items: center;
        transition: transform 0.12s, filter 0.2s;
      }
      .send-btn:hover:not(:disabled) {
        filter: brightness(1.05);
      }
      .send-btn:active:not(:disabled) {
        transform: scale(0.94);
      }
      .send-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .send-btn svg {
        width: 20px;
        height: 20px;
      }

      /* Mobile */
      @media (max-width: 820px) {
        .layout {
          grid-template-columns: 1fr;
        }
        .modules {
          flex-direction: row;
          overflow-x: auto;
          padding-bottom: 4px;
          gap: 10px;
        }
        .module-btn {
          flex: 0 0 220px;
        }
        .disclaimer {
          text-align: left;
        }
        .msg {
          max-width: 88%;
        }
      }
    </style>
  </head>

  <body>
    <div class="app">
      <header>
        <div class="brand">
          <h1>Hypnoy&nbsp;·&nbsp;Coaching Companion</h1>
          <p>Four gentle, evidence-informed guides for the mind and nervous system.</p>
        </div>
        <p class="disclaimer">
          A holistic coaching companion — not therapy, diagnosis, or medical advice.
          In crisis, contact your local emergency line or call/text 988 (US).
        </p>
      </header>

      <div class="layout">
        <nav class="modules" id="modules" aria-label="Coaching modules"></nav>

        <section class="panel" aria-label="Conversation">
          <div class="panel-head">
            <div class="glyph" id="head-glyph">⚡</div>
            <div>
              <div class="p-title" id="head-title">Reducing the Charge</div>
              <div class="p-tag" id="head-tag"></div>
            </div>
            <div class="spacer"></div>
            <button class="reset-btn" id="reset" type="button">Clear conversation</button>
          </div>

          <div class="messages" id="messages"></div>

          <form class="composer" id="composer">
            <textarea
              id="input"
              rows="1"
              placeholder="Share what's on your mind…"
              autocomplete="off"
            ></textarea>
            <button class="send-btn" id="send" type="submit" aria-label="Send">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 2 11 13" />
                <path d="M22 2 15 22l-4-9-9-4 20-7z" />
              </svg>
            </button>
          </form>
        </section>
      </div>
    </div>

    <script>
      const MODULES = [
        {
          id: 'reducing-the-charge',
          name: 'Reducing the Charge',
          tag: 'Soften the intensity around a memory, trigger, or belief.',
          emoji: '⚡',
          accent: '#d08a3e',
          soft: '#f3e4d1',
          greeting:
            "Welcome. This is a gentle space to lower the emotional charge around something that still stings. Is there a memory, trigger, or feeling you'd like to work with today? Just a short title is enough to begin.",
        },
        {
          id: 'cbt',
          name: 'CBT Coach',
          tag: 'Catch the thought, test it, and find a kinder, truer one.',
          emoji: '💭',
          accent: '#3f8f8a',
          soft: '#d9ebe9',
          greeting:
            "Hi, I'm glad you're here. Together we can look at a thought or situation that's weighing on you and gently work it through, step by step. What's the situation that stirred up the difficult feeling?",
        },
        {
          id: 'executive-dysfunction',
          name: 'Executive Function Ally',
          tag: 'Get unstuck and into motion — one tiny step at a time.',
          emoji: '🚀',
          accent: '#6a63c9',
          soft: '#e2e0f4',
          greeting:
            "Hey. Being stuck isn't laziness — it's just how the brain gets jammed sometimes, and we can work with that. What's the task or moment you feel stuck on right now?",
        },
        {
          id: 'inner-compass',
          name: 'Inner Compass',
          tag: 'Meet the part that struggles — with warmth, not judgment.',
          emoji: '🧭',
          accent: '#b3688a',
          soft: '#f1dfe7',
          greeting:
            "Hello, and welcome. This is a place to turn toward the parts of you that are struggling with a little more kindness. What are you being hard on yourself about, or which inner voice feels loud right now?",
        },
      ]

      const STORE_KEY = 'hypnoy_coach_threads_v1'
      const $ = (id) => document.getElementById(id)
      const messagesEl = $('messages')
      const inputEl = $('input')
      const sendBtn = $('send')

      let threads = load()
      let current = MODULES[0].id
      let busy = false

      function load() {
        try {
          return JSON.parse(localStorage.getItem(STORE_KEY)) || {}
        } catch {
          return {}
        }
      }
      function save() {
        try {
          localStorage.setItem(STORE_KEY, JSON.stringify(threads))
        } catch {}
      }

      function moduleById(id) {
        return MODULES.find((m) => m.id === id)
      }

      function setTheme(m) {
        document.documentElement.style.setProperty('--m-accent', m.accent)
        document.documentElement.style.setProperty('--m-soft', m.soft)
      }

      // Minimal, safe formatting: escape HTML, then apply **bold**, bullet lines, paragraphs.
      function render(text) {
        const esc = text
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
        const bold = esc.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        const blocks = bold.split(/\n{2,}/).map((block) => {
          const lines = block.split('\n')
          const isList = lines.every((l) => /^\s*[-*•]\s+/.test(l))
          if (isList) {
            const items = lines
              .map((l) => '<li>' + l.replace(/^\s*[-*•]\s+/, '') + '</li>')
              .join('')
            return '<ul>' + items + '</ul>'
          }
          return '<p>' + block.replace(/\n/g, '<br>') + '</p>'
        })
        return blocks.join('')
      }

      function renderModules() {
        const nav = $('modules')
        nav.innerHTML = ''
        MODULES.forEach((m) => {
          const btn = document.createElement('button')
          btn.className = 'module-btn'
          btn.type = 'button'
          btn.setAttribute('aria-pressed', String(m.id === current))
          btn.style.setProperty('--m-accent', m.accent)
          btn.style.setProperty('--m-soft', m.soft)
          btn.innerHTML =
            '<span class="glyph">' +
            m.emoji +
            '</span><span><span class="m-name">' +
            m.name +
            '</span><span class="m-tag">' +
            m.tag +
            '</span></span>'
          btn.addEventListener('click', () => selectModule(m.id))
          nav.appendChild(btn)
        })
      }

      function renderChat() {
        const m = moduleById(current)
        setTheme(m)
        $('head-glyph').textContent = m.emoji
        $('head-glyph').style.background = m.soft
        $('head-title').textContent = m.name
        $('head-tag').textContent = m.tag

        messagesEl.innerHTML = ''
        // Always open with the module greeting (UI only, not sent to the model).
        addBubble('assistant', m.greeting, false)
        const thread = threads[current] || []
        thread.forEach((msg) => addBubble(msg.role, msg.content, false))
        scrollDown()
      }

      function addBubble(role, text, animate) {
        const el = document.createElement('div')
        el.className = 'msg ' + role
        el.innerHTML = render(text)
        messagesEl.appendChild(el)
        if (animate) scrollDown()
        return el
      }

      function showTyping() {
        const el = document.createElement('div')
        el.className = 'typing'
        el.id = 'typing'
        el.innerHTML = '<span></span><span></span><span></span>'
        messagesEl.appendChild(el)
        scrollDown()
      }
      function hideTyping() {
        const t = $('typing')
        if (t) t.remove()
      }

      function scrollDown() {
        messagesEl.scrollTop = messagesEl.scrollHeight
      }

      function selectModule(id) {
        if (busy || id === current) return
        current = id
        renderModules()
        renderChat()
        inputEl.focus()
      }

      function autogrow() {
        inputEl.style.height = 'auto'
        inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px'
      }

      async function send(text) {
        const thread = threads[current] || (threads[current] = [])
        thread.push({ role: 'user', content: text })
        save()
        addBubble('user', text, true)

        busy = true
        sendBtn.disabled = true
        showTyping()

        try {
          const res = await fetch('/api/coach', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ module: current, messages: thread }),
          })
          hideTyping()
          if (!res.ok) {
            const info = await res.json().catch(() => ({}))
            throw new Error(info.error || 'Request failed (' + res.status + ')')
          }
          const data = await res.json()
          thread.push({ role: 'assistant', content: data.reply })
          save()
          addBubble('assistant', data.reply, true)
        } catch (err) {
          hideTyping()
          addBubble(
            'assistant',
            "I'm having trouble responding right now. " +
              (err.message || '') +
              '\n\nPlease try again in a moment.',
            true
          )
        } finally {
          busy = false
          sendBtn.disabled = false
          inputEl.focus()
        }
      }

      // Events
      $('composer').addEventListener('submit', (e) => {
        e.preventDefault()
        const text = inputEl.value.trim()
        if (!text || busy) return
        inputEl.value = ''
        autogrow()
        send(text)
      })

      inputEl.addEventListener('input', autogrow)
      inputEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault()
          $('composer').requestSubmit()
        }
      })

      $('reset').addEventListener('click', () => {
        if (busy) return
        threads[current] = []
        save()
        renderChat()
        inputEl.focus()
      })

      // Init
      renderModules()
      renderChat()
      inputEl.focus()
    </script>
  </body>
</html>
