<style>
/* Layout: one ruled notebook page with a red margin line. Flows are one 600px column;
   the reading opens out to 1120px with the contents in a 280px left column. Light only (brand rule). */
:root {
  --ink: #15203B; --muted: #56607A; --paper: #FFFFFF; --paper-2: #F5F7FB;
  --rule: #DCE3EE; --rule-line: #EDF1F7; --margin: #FF7A66; --note: #E0523D;
  --hl: #D4F36B; --link: #1F4FD8; --error: #B42318; --track: #E9EEF6;
  --recharge: #CDBDFF; --recharge-t: #EFEAFF; --explore: #A8DBFF; --explore-t: #E4F4FF;
  --unstick: #FFC27A; --unstick-t: #FFF0DC; --launch: #C9EF6E; --launch-t: #EEF9D3;
  --q: var(--hl); --q-t: var(--paper-2);
  --display: 'Familjen Grotesk', ui-sans-serif, system-ui, sans-serif;
  --body: Figtree, ui-sans-serif, system-ui, sans-serif;
  --hand: Caveat, 'Segoe Print', cursive;
  --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { background: var(--paper); }
body {
  margin: 0; color: var(--ink); font: 17px/1.55 var(--body);
  background: var(--paper) repeating-linear-gradient(to bottom, transparent 0, transparent 31px, var(--rule-line) 31px, var(--rule-line) 32px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  min-height: 100vh;
}
.page { position: relative; max-width: 648px; margin: 0 auto; padding: 22px 0 64px 32px; min-height: 100vh; }
.page.wide { max-width: 1152px; }
.page::before { content: ""; position: absolute; top: 0; bottom: 0; left: 16px; width: 2px; background: var(--margin); opacity: .85; }
a { color: var(--link); }
:focus-visible { outline: 3px solid var(--link); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; letter-spacing: -0.5px; text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: clamp(38px, 9vw, 52px); letter-spacing: -1.5px; }
h2 { font-size: clamp(26px, 5vw, 32px); }
h3 { font-size: 20px; font-weight: 600; }
p { margin: 0; }
.hl { background: linear-gradient(transparent 56%, var(--hl) 56%, var(--hl) 92%, transparent 92%); }
.note { font: 600 26px/1 var(--hand); color: var(--note); transform: rotate(-3deg); display: inline-block; align-self: flex-start; margin-bottom: 4px; }
.label { font: 700 12px/1.2 var(--body); letter-spacing: 1.4px; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.stack { display: flex; flex-direction: column; gap: 18px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

/* Header */
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 34px; flex-wrap: wrap; }
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
.logo b { font: 700 22px/1 var(--display); letter-spacing: -0.02em; display: block; }
.logo small { font: 700 9px/1 var(--body); letter-spacing: 1.6px; text-transform: uppercase; color: var(--muted); display: block; margin-top: 3px; }
.linkbtn { background: none; border: 0; color: var(--link); text-decoration: underline; font: 500 15px var(--body); min-height: 44px; padding: 0 4px; cursor: pointer; }

/* Buttons and answers */
.btn { background: var(--ink); color: #fff; border: 0; border-radius: 14px; min-height: 56px; padding: 10px 26px; font: 700 19px var(--display);
  box-shadow: 0 4px 0 var(--q); cursor: pointer; transition: transform .08s, box-shadow .08s; }
.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--q); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn2 { background: var(--paper); color: var(--ink); border: 2px solid var(--ink); border-radius: 14px; min-height: 52px; padding: 8px 22px; font: 700 17px var(--display); cursor: pointer; }
.answers { display: flex; flex-direction: column; gap: 10px; }
.ans { width: 100%; text-align: left; background: var(--paper); border: 1.5px solid var(--rule); border-radius: 14px; min-height: 56px; padding: 12px 16px;
  font: 17px/1.35 var(--body); color: var(--ink); cursor: pointer; }
.ans:hover { border-color: var(--ink); }
.ans.on { background: var(--hl); border: 2px solid var(--ink); font-weight: 700; }

/* Progress */
.progress { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
.bar { flex: 1; height: 8px; border-radius: 99px; background: var(--track); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ink); border-radius: 99px; transition: width .25s; }
.progress span { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* Compass pair */
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pair div { background: var(--paper-2); border-radius: 12px; padding: 14px; font-size: 16px; min-width: 0; }
.scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; background: var(--paper-2); border-radius: 16px; padding: 16px 8px 12px; }
.dot { display: flex; flex-direction: column; align-items: center; gap: 8px; background: none; border: 0; cursor: pointer; font: 500 12px/1.25 var(--body); color: var(--muted); text-align: center; min-height: 44px; padding: 0; }
.dot i { display: block; border-radius: 50%; border: 1.5px solid var(--ink); background: var(--paper); }
.dot.on i { background: var(--hl); border-width: 2.5px; }
.dot.on { color: var(--ink); font-weight: 700; }

/* Fields */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-weight: 600; font-size: 15px; }
.field input, .field textarea { font: 17px/1.4 var(--body); color: var(--ink); background: var(--paper); border: 1.5px solid var(--rule); border-radius: 14px; padding: 12px 14px; min-height: 52px; width: 100%; }
.field input:focus, .field textarea:focus { border-color: var(--ink); outline: none; box-shadow: 0 0 0 3px var(--hl); }
.field textarea { min-height: 150px; resize: vertical; }
.hint { font-size: 14px; color: var(--muted); }
.check { display: flex; gap: 10px; align-items: center; font-size: 15px; min-height: 44px; }
.check input { width: 20px; height: 20px; accent-color: var(--ink); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.err { color: var(--error); font-size: 15px; font-weight: 600; }

/* Cards and panels */
.card { background: var(--paper); border: 1.5px solid var(--rule); border-radius: 16px; padding: 18px; }
.soft { background: var(--paper-2); border-radius: 16px; padding: 18px; }
.feature { background: var(--paper); border: 2px solid var(--ink); border-radius: 16px; padding: 20px; box-shadow: 0 4px 0 var(--q); }
.ticks { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 9px; }
.ticks li { position: relative; padding-left: 30px; }
.ticks li::before { content: ""; position: absolute; left: 4px; top: 4px; width: 12px; height: 7px; border-left: 2.4px solid var(--ink); border-bottom: 2.4px solid var(--ink); transform: rotate(-45deg); }
.support { border-left: 4px solid var(--margin); padding: 14px 16px; background: var(--paper-2); border-radius: 0 12px 12px 0; }
.support b { font-variant-numeric: tabular-nums; }

/* The sealed cast */
.seal { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; }
.hexa { display: flex; flex-direction: column-reverse; gap: 6px; width: 66px; }
.hexa i { height: 8px; background: var(--ink); border-radius: 2px; display: flex; justify-content: space-between; }
.hexa i.yin { background: linear-gradient(90deg, var(--ink) 0 42%, transparent 42% 58%, var(--ink) 58%); }
.hexa i.chg { outline: 2px solid var(--note); outline-offset: 2px; }
.hexa.sealed i { background: var(--rule); }
.cards7 { display: flex; gap: 6px; flex-wrap: wrap; }
.cards7 span { width: 30px; height: 46px; border-radius: 5px; border: 1.5px solid var(--ink); background: repeating-linear-gradient(45deg, var(--paper-2) 0 4px, var(--rule) 4px 6px); }
.drawlist { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 15px; }
.drawlist dt { color: var(--muted); }
.drawlist dd { margin: 0; font-weight: 600; }

/* Generating */
.lanes { display: flex; flex-direction: column; gap: 10px; }
.lane { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: center; padding: 10px 14px; border: 1.5px solid var(--rule); border-radius: 12px; background: var(--paper); }
.lane .st { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--rule); }
.lane.run .st { border-color: var(--ink); border-top-color: transparent; animation: spin .9s linear infinite; }
.lane.done .st { border: 0; background: var(--hl); position: relative; }
.lane.done .st::after { content: ""; position: absolute; left: 5px; top: 4px; width: 8px; height: 5px; border-left: 2px solid var(--ink); border-bottom: 2px solid var(--ink); transform: rotate(-45deg); }
.lane b { font-weight: 600; font-size: 15px; }
.lane small { display: block; color: var(--muted); font-size: 13px; }
.lane em { font-style: normal; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.lanehead { margin-top: 8px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Result */
.grid2x2 { width: 100%; max-width: 320px; aspect-ratio: 1; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 4px; position: relative; }
.grid2x2 div { border-radius: 10px; padding: 10px; font: 700 15px var(--display); display: flex; align-items: flex-start; }
.grid2x2 .me-dot { position: absolute; width: 18px; height: 18px; border-radius: 50%; background: var(--ink); border: 3px solid #fff; box-shadow: 0 0 0 1.5px var(--ink); transform: translate(-50%, 50%); }
.axes { display: flex; justify-content: space-between; max-width: 320px; font-size: 12px; color: var(--muted); }
.slider { display: flex; flex-direction: column; gap: 6px; }
.slider .ends { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
.slider .ends b { color: var(--ink); }
.slider .track { position: relative; height: 10px; border-radius: 99px; background: var(--track); }
.slider .fill { position: absolute; top: 0; bottom: 0; background: var(--ink); border-radius: 99px; }
.slider .knob { position: absolute; top: 50%; width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 3px solid var(--ink); transform: translate(-50%, -50%); }
.quad-name { font: 700 clamp(40px, 10vw, 56px)/1 var(--display); letter-spacing: -1.5px; }

/* Reading */
.reader { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 40px; align-items: start; }
.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); max-height: calc(100vh - 32px); overflow: auto; display: flex; flex-direction: column; gap: 2px; padding-bottom: 20px; }
.toc a { color: var(--ink); text-decoration: none; font-size: 14px; padding: 7px 10px; border-radius: 10px; line-height: 1.3; }
.toc a:hover { background: var(--paper-2); }
.toc a.cur { background: var(--hl); font-weight: 700; }
.legend { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); padding: 10px; margin-top: 10px; border-top: 1.5px dashed var(--rule); }
.banner { background: var(--paper-2); border-radius: 14px; padding: 14px 16px; font-size: 15px; display: flex; flex-direction: column; gap: 4px; }
.md { min-width: 0; font-size: 17px; }
.md > * + * { margin-top: 14px; }
.md h1 { font-size: clamp(36px, 7vw, 48px); }
.md h2 { margin-top: 48px; padding-top: 28px; border-top: 1.5px dashed var(--rule); scroll-margin-top: 16px; }
.md h3 { margin-top: 30px; font-size: 22px; }
.md h4 { margin-top: 22px; font: 600 18px/1.3 var(--display); }
.md p, .md li { max-width: 68ch; }
.md ul { padding-left: 22px; }
.md li + li { margin-top: 6px; }
.md li ul { margin-top: 6px; }
.md li li { color: var(--muted); }
.md blockquote { margin-left: 0; padding: 12px 16px; background: var(--paper-2); border-radius: 12px; border: 0; }
.md blockquote p { max-width: none; }
.md table { border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
.md th { text-align: left; font: 700 12px var(--body); letter-spacing: .8px; text-transform: uppercase; color: var(--muted); border-bottom: 1.5px solid var(--rule); padding: 8px 10px; }
.md td { border-bottom: 1px solid var(--rule); padding: 7px 10px; vertical-align: top; }
.tablewrap { overflow-x: auto; max-width: 100%; }
.md pre { background: var(--paper-2); border-radius: 12px; padding: 14px; overflow-x: auto; font: 14px/1.25 var(--mono); }
.md code { font-family: var(--mono); font-size: .9em; }
.md li.task { list-style: none; margin-left: -22px; display: flex; gap: 10px; align-items: flex-start; color: var(--ink); }
.md li.task input { width: 20px; height: 20px; margin-top: 3px; accent-color: var(--ink); flex: none; }
.mk { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 6px; font-size: 11px; vertical-align: 1px; margin-right: 2px; }
.mk.trad { background: var(--paper-2); border: 1.5px solid var(--ink); }
.mk.pers { background: var(--hl); border: 1.5px solid var(--ink); }
.md strong { font-weight: 700; }

.foot { margin-top: 56px; padding-top: 18px; border-top: 1.5px dashed var(--rule); font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
.foot b { color: var(--ink); }

@media (max-width: 980px) {
  .reader { grid-template-columns: minmax(0, 1fr); gap: 20px; }
  .toc { position: static; max-height: none; flex-direction: row; flex-wrap: wrap; gap: 6px; }
  .toc a { border: 1.5px solid var(--rule); border-radius: 99px; padding: 8px 12px; min-height: 40px; display: inline-flex; align-items: center; }
  .legend { width: 100%; }
}
@media (max-width: 520px) {
  .pair, .two { grid-template-columns: 1fr; }
  .dot { font-size: 11px; }
  .seal { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<script>
// ── Engine modules, inlined at build time from the server code ──
// Deterministic divination engine, shared by the server (which casts and
// interprets readings) and the client (which renders them).

const HN=["","The Creative","The Receptive","Difficult Beginnings","Youthful Folly","Waiting","Conflict","The Army","Holding Together","Small Taming","Treading","Peace","Standstill","Fellowship","Great Possession","Modesty","Enthusiasm","Following","Work on the Corrupted","Approach","Contemplation","Biting Through","Grace","Splitting Apart","Return","Innocence","Great Taming","Nourishment","Great Excess","The Abysmal","The Clinging","Influence","Duration","Retreat","Great Power","Progress","Darkening of the Light","The Family","Opposition","Obstruction","Deliverance","Decrease","Increase","Breakthrough","Coming to Meet","Gathering","Ascending","Oppression","The Well","Revolution","The Cauldron","Thunder","Mountain","Gradual Progress","The Marrying Maiden","Abundance","The Wanderer","Wind","Joy","Dispersion","Limitation","Inner Truth","Small Excess","After Completion","Before Completion"];
const HB=[63,0,17,34,23,58,2,16,55,59,7,56,61,47,4,8,25,38,3,48,41,37,32,1,57,39,33,30,18,45,28,14,60,15,40,5,53,43,20,10,35,49,31,62,24,6,26,22,29,46,9,36,52,11,13,44,54,27,50,19,51,12,21,42];
const TD=["Fool","Magician","High Priestess","Empress","Emperor","Hierophant","Lovers","Chariot","Strength","Hermit","Wheel of Fortune","Justice","Hanged Man","Death","Temperance","Devil","Tower","Star","Moon","Sun","Judgement","The World","Ace of Wands","Two of Wands","Three of Wands","Four of Wands","Five of Wands","Six of Wands","Seven of Wands","Eight of Wands","Nine of Wands","Ten of Wands","Page of Wands","Knight of Wands","Queen of Wands","King of Wands","Ace of Cups","Two of Cups","Three of Cups","Four of Cups","Five of Cups","Six of Cups","Seven of Cups","Eight of Cups","Nine of Cups","Ten of Cups","Page of Cups","Knight of Cups","Queen of Cups","King of Cups","Ace of Swords","Two of Swords","Three of Swords","Four of Swords","Five of Swords","Six of Swords","Seven of Swords","Eight of Swords","Nine of Swords","Ten of Swords","Page of Swords","Knight of Swords","Queen of Swords","King of Swords","Ace of Pentacles","Two of Pentacles","Three of Pentacles","Four of Pentacles","Five of Pentacles","Six of Pentacles","Seven of Pentacles","Eight of Pentacles","Nine of Pentacles","Ten of Pentacles","Page of Pentacles","Knight of Pentacles","Queen of Pentacles","King of Pentacles"];
const TP=["Who Am I?","What's Important?","What Do I Want?","What's In the Way?","How Do I Show Up?","What Do I Do?","What's the Next Step?"];

const MAX_SEED = 2147483647;

function isValidSeed(seed) {
  return Number.isInteger(seed) && seed > 0 && seed < MAX_SEED;
}

function mkRNG(seed) {
  let s = seed % 2147483647;
  if (s <= 0) s += 2147483646;
  return function() { s = s * 16807 % 2147483647; return (s-1)/2147483646; };
}

function flipBit(n, pos) {
  const bit = Math.pow(2, pos);
  return n % (bit*2) >= bit ? n - bit : n + bit;
}

function divineReading(ts) {
  const b2h = {};
  HB.forEach(function(b,i){ b2h[b] = i+1; });
  const rng = mkRNG(ts);
  let pBin = 0;
  const changing = [], lines = [];
  for (let i=0; i<6; i++) {
    const sum = (rng()<0.5?2:3) + (rng()<0.5?2:3) + (rng()<0.5?2:3);
    lines.push(sum);
    if (sum===7||sum===9) pBin += Math.pow(2,i);
    if (sum===6||sum===9) changing.push(i+1);
  }
  const pH = b2h[pBin] || 1;
  let rBin = pBin;
  changing.forEach(function(l){ rBin = flipBit(rBin, l-1); });
  const rH = changing.length > 0 ? (b2h[rBin]||null) : null;
  const rng2 = mkRNG(ts + 1000003);
  const deck = Array.from({length:78}, function(_,i){ return i+1; });
  const cards = [];
  for (let i=0; i<7; i++) {
    const j = i + Math.floor(rng2() * (78-i));
    const tmp = deck[i]; deck[i] = deck[j]; deck[j] = tmp;
    cards.push({name: TD[deck[i]-1], pos: TP[i]});
  }
  return {ts, lines, pHex:pH, pName:HN[pH], changing, rHex:rH, rName:rH?HN[rH]:null, cards};
}

// One-line description of a reading, used to give the model context.
function describeReading(r) {
  return "I Ching: Hexagram "+r.pHex+" ("+r.pName+")"+(r.rHex?" → "+r.rHex+" ("+r.rName+")":"")+
    (r.changing.length?", changing lines: "+r.changing.join(", "):"")+
    ". Tarot: "+r.cards.map(function(c){return c.pos+" "+c.name;}).join("; ");
}

const CRISIS_KW = ["suicide","suicidal","kill myself","end my life","want to die","self-harm","hurt myself","cut myself","overdose"];
const detectCrisis = t => CRISIS_KW.some(k => t.toLowerCase().includes(k));
const CRISIS_RES = [{name:"Lifeline",num:"13 11 14"},{name:"Beyond Blue",num:"1300 22 4636"},{name:"Emergency",num:"000"}];

// The Career Reading quiz: a Work Style Compass short form (12 paired
// statements) and the New Page "where are you at" questions (8 statements,
// situation, satisfaction, wellbeing). Scored on the server only.

// ── Work Style Compass, short form ──────────────────────────────────────────
// Each statement pair: `left` and `right` are the two sides, `l`/`r` the
// letter each side counts toward. Eight pairs are the published guide's
// examples; four (marked new) were written for this short form so each
// polarity has both sides on the left at least once.
const COMPASS = [
  { id: "e1", pol: "energy", l: "O", r: "I", left: "I think best by talking ideas through with others.", right: "I think best by mulling things over on my own first." },
  { id: "i1", pol: "information", l: "C", r: "B", left: "I trust methods that have been tested and shown to work.", right: "I'm drawn to new ways of doing things, even if they're untested." },
  { id: "d1", pol: "decisions", l: "L", r: "V", left: "When making a decision, I weigh up the pros and cons first.", right: "When making a decision, I think first about how it will affect the people involved." },
  { id: "s1", pol: "structure", l: "P", r: "A", left: "I like to have a plan before I start.", right: "I like to start and work it out as I go." },
  { id: "e2", pol: "energy", l: "I", r: "O", left: "After a full day of meetings, I need quiet time to recharge.", right: "After a full day of meetings, I often feel buzzing and ready for more." },
  { id: "i2", pol: "information", l: "C", r: "B", left: "I learn best by doing it, or by seeing it done.", right: "I learn best by understanding the idea behind it." },

const COMPASS_SCALE = ["Left is very like me", "Left is a bit like me", "Both, or it depends", "Right is a bit like me", "Right is very like me"];

const POLARITIES = {
  energy: { name: "Energy", q: "Where do you get your energy at work?", a: "O", b: "I" },

const ORDER = ["energy", "information", "decisions", "structure"];

const STATEMENTS = [
  { id: 1, text: "I can describe the kind of work I want next in one sentence.", axis: "clarity" },

const LIKE = ["Not like me", "A little like me", "Mostly like me", "Very like me"];
const SITUATIONS = ["I'm employed or earning an income", "Between jobs", "Coming back after a break", "Wanting to change careers", "Studying or early in my career", "Something else"];
const WELLBEING = ["Really good", "Mostly good", "Up and down", "Mostly low", "I'm really struggling"];
const asksSatisfaction = situation => situation === 0 || situation === 3;

const int = (v, lo, hi) => Number.isInteger(v) && v >= lo && v <= hi;

class QuizError extends Error {}

// Validates and scores the answers. `a` = {compass: {e1: -2..2, …}, statements: [1..4 ×8],
// situation: 0..5, satisfied?: 1..4, wellbeing: 0..4}.
function scoreQuiz(a) {
  if (!a || typeof a !== "object") throw new QuizError("missing answers");
  const compass = {};
  for (const q of COMPASS) {
    const v = a.compass && a.compass[q.id];
    if (!int(v, -2, 2)) throw new QuizError("compass " + q.id);
    compass[q.id] = v;
  }
  const st = a.statements;
  if (!Array.isArray(st) || st.length !== 8 || !st.every(v => int(v, 1, 4))) throw new QuizError("statements");
  if (!int(a.situation, 0, SITUATIONS.length - 1)) throw new QuizError("situation");
  if (asksSatisfaction(a.situation) && !int(a.satisfied, 1, 4)) throw new QuizError("satisfied");
  if (!int(a.wellbeing, 0, WELLBEING.length - 1)) throw new QuizError("wellbeing");

  return {
    compass: scoreCompass(compass),
    where: scoreWhere(st),
    situation: a.situation,
    satisfied: asksSatisfaction(a.situation) ? a.satisfied : null,
    wellbeing: a.wellbeing,
    safety: a.wellbeing === 4 ? "struggling" : a.wellbeing === 3 ? "low" : "ok",
  };
}

function scoreWhere(st) {
  const pts = st.map((v, i) => (STATEMENTS[i].reverse ? 5 - v : v));
  const clarity = pts[0] + pts[2] + pts[4] + pts[6];
  const capacity = pts[1] + pts[3] + pts[5] + pts[7];
  const hiC = clarity >= 11, hiK = capacity >= 11;
  const quadrant = hiC ? (hiK ? "Launch" : "Unstick") : (hiK ? "Explore" : "Recharge");
  return {
    clarity, capacity, quadrant,
    dot: { x: +((capacity - 4) / 12).toFixed(3), y: +((clarity - 4) / 12).toFixed(3) },
    burnout: st[3] >= 3,
  };
}

const MAX = 6;   // three statements × 2 points
const band = s => (s / MAX < 0.2 ? "Flexible" : s / MAX < 0.45 ? "Slight lean" : s / MAX < 0.75 ? "Clear lean" : "Strong lean");

function scoreCompass(ans) {
  const leans = {}, flags = [];
  let middles = 0;
  for (const pol of ORDER) {
    const P = POLARITIES[pol], pts = { [P.a]: 0, [P.b]: 0 };
    let mid = 0, veryA = 0, veryB = 0;
    COMPASS.filter(q => q.pol === pol).forEach(q => {
      const v = ans[q.id];
      if (v === 0) { mid++; return; }
      const side = v < 0 ? q.l : q.r;
      pts[side] += Math.abs(v);
      if (Math.abs(v) === 2) side === P.a ? veryA++ : veryB++;
    });
    middles += mid;
    const strength = Math.abs(pts[P.a] - pts[P.b]);
    const b = band(strength);
    const toward = pts[P.a] === pts[P.b] ? null : pts[P.a] > pts[P.b] ? P.a : P.b;
    const letter = b === "Flexible" || !toward ? P.a + "/" + P.b : toward;
    // Position on the slider: 0 = fully side a, 1 = fully side b.
    const pos = 0.5 + (pts[P.b] - pts[P.a]) / (2 * MAX);
    leans[pol] = { letter, toward: b === "Flexible" ? null : toward, strength, band: b, percent: Math.round(50 + (50 / MAX) * strength), pos: +pos.toFixed(3), points: pts };
    if (mid >= 2) flags.push({ flag: "It depends", polarity: P.name, text: "The setting really matters for you here. Notice which places bring out each side." });
    if (veryA >= 1 && veryB >= 1) flags.push({ flag: "Two sides", polarity: P.name, text: "Strong signs of both. You may have built one side for work or study. Which feels more like you?" });
  }
  if (middles >= 5) flags.push({ flag: "Lots of middle answers", polarity: null, text: "Try again while picturing one job or study setting, or talk it through with a career counsellor." });
  const code = ORDER.map(p => leans[p].letter).join("-");
  return { leans, code, flags, ...describeStyle(leans) };
}

// Work Focus = Information + Decisions; Work Rhythm = Energy + Structure.
// A flexible polarity opens both options, so a result can match several styles.
function opts(l) { return l.includes("/") ? l.split("/") : [l]; }
function describeStyle(leans) {
  const E = opts(leans.energy.letter), I = opts(leans.information.letter), D = opts(leans.decisions.letter), S = opts(leans.structure.letter);
  const focus = I.flatMap(i => D.map(d => i + d)), rhythm = E.flatMap(e => S.map(s => e + s));
  const styles = rhythm.flatMap(r => focus.map(f => [r[0], f[0], f[1], r[1]].join("-")));
  return { focus, rhythm, styles };
}

nd leave the terms vague?\n\n#### 2. What's Important? Temperance\n\n*What matters most here.*\n\nTemperance pours water steadily between two cups, mixing rather than choosing. What matters most here is balance, patience and finding the blend that works, not rushing to an extreme.\n\n**For work:** What matters most for work right now is balance: blending two paths, two roles or two speeds rather than lurching from one to the other. Temperance favours careful, staged changes and a pace you can sustain.\n\n#### 3. What Do I Want? Queen of Swords\n\n*The desire underneath.*\n\nThe Queen of Swords sits upright, sword raised, looking clearly at what is in front of her. The desire underneath is for clear sight, an honest voice and the independence to judge for yourself.\n\n**For work:** The career desire underneath is for autonomy and a clear voice: to be the person whose judgement is trusted and who says what they see. It points to work where expertise, independence and honest advice are the product.\n\n#### 4. What's In the Way? Two of Wands\n\n*The obstacle.*\n\nThe Two of Wands stands on a castle wall holding a globe, looking out at a world they have planned but not yet entered. As the obstacle, it is the comfort of planning: staying at the window when the next step is to walk out the door.\n\n**For work:** The obstacle is staying in the planning phase. The Two of Wands has mapped the future and knows the options, but the plan can become a safe place to wait; at work this looks like research, scenarios and spreadsheets in place of a first real step.\n\n#### 5. How Do I Show Up? Ace of Cups\n\n*How to show up, in mindset or action, to get past what's in the way.*\n\nThe Ace of Cups is an open heart, overflowing. Showing up this way means leading with feeling and generosity, letting what you care about be seen rather than kept safely behind good judgement.\n\n**For work:** To get past the obstacle, bring warmth and genuine care into how you work and how you present your  of Wands): keep going, but protect your energy.\n\nThe I Ching agrees and adds a caution. Fellowship favours open alliances and shared purpose, the changing line says don't pick a fight you can't win cleanly, and the move to The Family says get your own base in order first. Together: build your circle, set fair terms, and take the real step you've been planning.\n\n## 4. The draw and your question\n\n> I have been a senior policy adviser in government for eight years. Should I leave this year to start my own consulting practice, or push for a bigger role where I am first?\n\n**1. Who Am I? Six of Pentacles.** After eight years advising, you are the person others draw on: your knowledge has been a resource handed out across a large organisation. The Six of Pentacles asks you to look at the exchange honestly. Consulting would turn that giving into something priced and named; staying would mean asking whether your current role pays back what you give.\n\n**2. What's Important? Temperance.** Temperance doesn't pick a side between leaving and staying; it mixes them. What matters most is a sustainable blend: a staged move, testing consulting work while you still have a base, or a bigger role that includes the independence you want.\n\n**3. What Do I Want? Queen of Swords.** Underneath the question is a wish for your own voice and your own judgement to be the product. The Queen of Swords wants to advise without filtering everything through a chain of approvals, and to be paid for clear thinking.\n\n**4. What's In the Way? Two of Wands.** The obstacle is that you have already planned this, perhaps many times. The Two of Wands holds the globe of your consulting practice and keeps looking at it from the safety of the wall. More planning won't settle the question; a small real test will.\n\n**5. How Do I Show Up? Ace of Cups.** Show up with heart, not only expertise. In conversations with possible clients, or with the people who'd decide a bigger role, let them see what you c t it can also keep you in a salaried role long after you've outgrown it. Your Moon squares the whole pattern, so the strain lands on your feelings and your energy. Neptune in your 2nd adds a tendency to be vague about money or to undercharge.\n\nWhat the current timing asks: right now transiting Venus has just sextiled your Midheaven, Uranus is supporting your Mercury from your 6th house of daily work, and Pluto is squaring your Mars, a slow pressure on how you use your drive. Over the next month, Mars crosses your Midheaven: a classic window for a visible, deliberate career move. Use it for a decision you've already thought through, not a sudden leap.\n\n### The chart\n\n#### Placements\n\n| Point | Position | House |\n|---|---|---|\n| ☉ Sun | 22°27' Cancer | 8th |\n| ☽ Moon | 18°53' Aries | 5th |\n| ☿ Mercury | 6°11' Leo | 9th |\n| ♀ Venus | 24°02' Gemini | 7th |\n| ♂ Mars | 1°44' Taurus | 5th |\n| ♃ Jupiter | 22°29' Cancer | 8th |\n| ♄ Saturn ℞ | 21°59' Capricorn | 2nd |\n| ♅ Uranus ℞ | 6°59' Capricorn | 1st |\n| ♆ Neptune ℞ | 12°56' Capricorn | 2nd |\n| ♇ Pluto ℞ | 15°00' Scorpio | 12th |\n| ☊ North Node | 7°30' Aquarius | 3rd |\n| AC Ascendant | 18°59' Sagittarius | 1st |\n| MC Midheaven | 29°22' Leo | 10th |\n\nElements: Fire 2 · Earth 4 · Air 1 · Water 3 · Modalities: Cardinal 6 · Fixed 3 · Mutable 1 · Chart ruler: Jupiter\n\nPatterns: T-Square (Jupiter, Saturn, Moon); T-Square (Saturn, Sun, Moon); T-Square (Neptune, Sun, Moon); Stellium (Saturn, Uranus, Neptune)\n\n| Point |   | Aspect | Point | Orb |\n|---|---|---|---|---|\n| ☉ Sun | □ | Square | ☽ Moon | 3.57° |\n| ☉ Sun | ☌ | Conjunction | ♃ Jupiter | 0.03° |\n| ☉ Sun | ☍ | Opposition | ♄ Saturn | 0.46° |\n| ☉ Sun | ☍ | Opposition | ♆ Neptune | 9.52° |\n| ☉ Sun | △ | Trine | ♇ Pluto | 7.45° |\n| ☽ Moon | ⚹ | Sextile | ♀ Venus | 5.15° |\n| ☽ Moon | □ | Square | ♃ Jupiter | 3.6° |\n| ☽ Moon | □ | Square | ♄ Saturn | 3.1° |\n| ☽ Moon | □ | Square | ♆ Neptune | 5.95° |\n| ☽ Moon | △ | Trine | AC Ascendant | 0 ur Human Design strategy work: let people invite you in, and see who does.\n\n### What the draw says\n\nYour draw was cast before you asked. It describes someone with a great deal to give (Six of Pentacles) who wants their own clear voice (Queen of Swords), and who is stuck on the wall (Two of Wands). It asks you to show up with heart (Ace of Cups), to move with a turning wheel (Wheel of Fortune) and to protect your energy for the last stretch (Nine of Wands). The I Ching adds: build alliances in the open, don't pick a fight on the way out, and set your home base in order first.\n\n### What the charts say, and where they disagree\n\nThey agree on the gift (clarity, precision, trusted advice), on where you're heading (independence) and on the brake (caution about money and energy). They disagree on pace. Numerology says this is the year of change. Vedic astrology says this is a year of discipline and slow building. Hold both: make the change this year, but make it structured. Your Human Design adds the rule that settles it: decide slowly, never at an emotional high or low.\n\n### Timing in the next 30 days\n\nUse the first fortnight to prepare, not to launch. Get your numbers and your offer clear, and avoid starting anything new on 8 November. Mercury and Venus turn direct on 14 November, and 10 November (a personal day 8) suits a money conversation. The strongest window for a visible step is 17 to 24 November, peaking when Mars crosses your natal Midheaven on 23–24 November. Bring your decision to that week, not your first idea.\n\n### One concrete first step\n\nThis week, write down three people who already know your work and might hire you as an adviser. Have one 20-minute conversation before 14 November: not a pitch, just \"what's hard for you right now that I might help with?\" Notice whether they invite you in. That one conversation will tell you more than another month of planning.\n\nThis reading is for reflection, not financial or legal advice. Before you leave a salaried role, talk to an accountant or financial adviser about your runway, and check your employment terms.\n\n## 14. Your tailored 4-week plan: Unstick\n\n*One small step, then the next.*\n\nHere's your plan. You're in Unstick, so the whole month is built on one idea: smaller steps than you think. You already know where you're heading. What's in the way isn't clarity, it's energy and the weight of the first step. Each week has the New Page steps as they are, plus a note on doing them in a way that fits you, and the best days to do it. Rest comes first: you said you're burnt out, and your charts agree that energy is your real constraint.\n\nEvery step works on its own, with nothing to buy.\n\n**Just for you**\n\n- Size the steps for evenings and weekends. And ask yourself: what would need to change in your current job for you to stay?\n- Put rest first and keep every step small. If it's been going on for weeks, it's worth talking to your GP or a counsellor.\n\n### Week 1 · Find what’s in the way\n\n*When you know what to do but can’t start, it’s usually not about willpower. Something makes the first step feel heavy.*\n\n- [ ] Name the one career task you keep putting off: updating your resume, emailing someone, applying for a role.\n- [ ] Shrink it until it takes 15 minutes or less. Ask: what is the very first physical action? “Open the document and fix the first section” is a first action. “Work on my resume” isn’t. Do it this week, at a set time.\n- [ ] Afterwards, notice what made starting hard. Fear of getting it wrong? Too many steps? Low energy? Not knowing where to begin? Write one line.\n\n**For you.** The task you keep putting off is probably the conversation that would make consulting real: telling someone you're open to work. Shrink it to 15 minutes: open a document and list three people who already know your work. That's it. Your Human Design says your opportunities come through your network and through invitation, so the list matters more than a ier next time. Move the block to another day instead of skipping it.\n\n**For you.** This is the week clarity returns, so use your blocks to simplify your offer: one sentence on what you do, for whom, and what it costs. Your Gene Keys say prosperity comes through simplicity, and your numerology says money takes conscious practice, so write a real number down. If a block slips, move it; don't skip it. Use one block to have the first 20-minute conversation with someone on your list: not a pitch, just a question about what's hard for them.\n\n**When.** 10 November (a personal day 8) for the money block; 12 or 14 November for the first conversation, once Mercury and Venus turn direct.\n\n> **Optional, with New Page:** The planner has a built-in focus timer, and the Action Coach is there when a block slips.\n\n### Week 4 · Finish something you can see\n\n*One finished thing builds more confidence than a lot of half-started ones.*\n\n- [ ] Finish one visible thing this week: an updated resume, a refreshed LinkedIn profile, or one application sent.\n- [ ] Write down your wins from the month, including the small ones. Then pick your next milestone and book its blocks.\n- [ ] Retake the quiz and see where you are.\n\n**For you.** Finish one visible thing: a one-page description of your advisory offer, or an updated LinkedIn profile that says what you now do. Your natal Midheaven wants your name on your work, and Mars crosses it this week, so this is the week to make your direction visible. Before you send anything big, give it a night: your Human Design authority says the right decision feels calm the next day. Then write your wins, book next month's blocks, and retake the quiz.\n\n**When.** 17 November to show your direction; 23–24 November (Mars crosses your Midheaven) for the visible step itself.\n\n> **Optional, with New Page:** The Resume Generator tailors a resume to a job ad in minutes.\n\n## 15. Support and limits\n\nCoaching, not therapy. For people 18 and over. In function generate() {

    { head: "Stage 1 · The draw (cast before your question)" },

    <div class="lanes">${lanes.map((l, i) => l.head ? `<p class="label lanehead">${esc(l.head)}</p>` :
      `<div class="lane" id="lane${i}"><span class="st"></span><span><b>${esc(l.name)}</b><small>${esc(l.sub)}</small></span><em><span class="c">0</span>/${l.n}</em></div>`).join("")}</div>
  </section>`;
  const run = lanes.map((l, i) => ({ ...l, i })).filter(l => l.id);
  const order = [["A", "natal", "vedic", "human-design", "gene-keys", "numerology"], ["B"], ["D"]];
  const fast = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const tick = (l, ms) => new Promise(res => {
    const el = $("#lane" + l.i), c = el.querySelector(".c"); el.classList.add("run"); let k = 0;
    const t = setInterval(() => { k = Math.min(l.n, k + Math.max(1, Math.ceil(l.n / 14))); c.textContent = k; if (k >= l.n) { clearInterval(t); el.classList.remove("run"); el.classList.add("done"); res(); } }, fast ? 5 : ms / 14);
  });
  (async () => {
    for (const group of order) await Promise.all(group.map(id => tick(run.find(l => l.id === id), id === "D" ? 2200 : 2600 + Math.random() * 1200)));

}

function gridHTML(w) {
  const cell = (name, full) => `<div style="background:var(${full ? QCOL[name][0] : QCOL[name][1]})">${name}</div>`;
  return `<div class="grid2x2" role="img" aria-label="You're in ${w.quadrant}: clarity ${w.clarity} of 16, capacity ${w.capacity} of 16">
    ${cell("Unstick", w.quadrant === "Unstick")}${cell("Launch", w.quadrant === "Launch")}${cell("Recharge", w.quadrant === "Recharge")}${cell("Explore", w.quadrant === "Explore")}
    <span class="me-dot" style="left:${(w.dot.x * 100).toFixed(1)}%;bottom:${(w.dot.y * 100).toFixed(1)}%"></span></div>
    <p class="small muted">Clarity runs up, capacity runs right. Clarity ${w.clarity} of 16, capacity ${w.capacity} of 16.</p>`;
}
function sliderHTML(pol, l) {
  const P = POLARITIES[pol], pos = l.pos * 100, from = Math.min(50, pos), to = Math.max(50, pos);
  return `<div class="slider"><div class="ends"><span><b>${P.a}</b> ${SIDES[P.a].name}</span><span>${l.band}</span><span>${SIDES[P.b].name} <b>${P.b}</b></span></div>
    <div class="track"><span class="fill" style="left:${from}%;right:${100 - to}%"></span><span class="knob" style="left:${pos}%"></span></div></div>`;
}
function result() {
  let sc;
  try { sc = scoreQuiz({ compass: S.compass, statements: S.statements, situation: S.situation, satisfied: S.satisfied, wellbeing: S.wellbeing }); }
  catch (e) { return start(); }
  const w = sc.where, Q = QUADRANTS[w.quadrant], c = sc.compass, r = S.draw.reading;
  setQ(w.quadrant);
  screen.innerHTML = `<section class="stack" style="gap:28px">
    <div class="stack" style="gap:10px"><span class="note">your reading is ready</span><span class="label">Where you're at</span>
      <p class="quad-name">You're in <span style="background:linear-gradient(transparent 56%, var(--q) 56%, var(--q) 92%, transparent 92%)">${w.quadrant}</span>.</p>
      <p><b>${esc(Q.tagline)}</b></p></div>
    ${gridHTML(w)}
    <p>${esc(Q.means)}</p>
    <div class="soft stack" style="gap:6px"><span class="label">Your first-week step</span><p>${esc(Q.first)}</p></div>
    <div class="stack"><span class="label">How you like to work · ${esc(c.code)}</span>
      ${["energy", "information", "decisions", "structure"].map(p => sliderHTML(p, c.leans[p])).join("")}
      <p><b>${c.styles.map(s => STYLES[s].name).join(" or ")}.</b> ${esc(STYLES[c.styles[0]].line)}</p></div>
    <div class="card stack" style="gap:12px"><span class="label">Your draw, unsealed</span>
      <div class="seal">${hexHTML(r, false)}<dl class="drawlist"><dt>I Ching</dt><dd>${r.pHex} ${esc(r.pName)}${r.rHex ? " → " + r.rHex + " " + esc(r.rName) : ""}</dd>
      ${r.cards.map((k, i) => `<dt>${i + 1}. ${esc(k.pos)}</dt><dd>${esc(k.name)}</dd>`).join("")}</dl></div>
      <p class="small muted">Cast ${new Date(S.draw.castAt).toLocaleTimeString()}, question asked ${new Date(S.askedAt).toLocaleTimeString()}.</p></div>
    <div class="feature stack" style="gap:12px"><h3>Your full reading</h3>
      <p>The full reading reads your five charts, this draw and your question in about 27,000 words. This prototype can't calculate charts or call the AI, so it opens a sample reading instead: Jordan Park, a fictional policy adviser in Unstick. Your scores above are real.</p>
      <div class="row"><button class="btn" type="button" id="open">Open the sample reading</button></div></div>
    ${sc.safety === "low" ? `<p class="small muted">You mentioned you've been feeling low. Go easy on yourself with this plan, and if things get heavier, Lifeline is there on 13 11 14, any time.</p>` : ""}
    <div><button class="linkbtn" type="button" id="again">Start again</button></div>
  </section>`;
  $("#open").onclick = () => go(reading);
  $("#again").onclick = () => { Object.assign(S, { compass: {}, statements: Array(8).fill(null), situation: null, satisfied: null, wellbeing: null, draw: null, question: "" }); go(start); };
}

// ── The sample reading ──
function reading() {
  setQ("Unstick"); page.classList.add("wide");
  const html = marked.parse(SAMPLE_REPORT, { gfm: true, headerIds: false, mangle: false });
  screen.innerHTML = `<div class="reader"><nav class="toc" id="toc" aria-label="Contents"></nav>
    <article class="md" id="md"><div class="banner"><span class="label">Sample reading</span><span>Jordan Park is fictional. The charts, the draw and the dates are calculated; the writing was produced step by step from each step's own prompt to test the format.</span></div>${html}</article></div>`;
  const md = $("#md"), toc = $("#toc");
  md.querySelectorAll("table").forEach(t => { const w = document.createElement("div"); w.className = "tablewrap"; t.parentNode.insertBefore(w, t); w.appendChild(t); });
  const walk = document.createTreeWalker(md, NodeFilter.SHOW_TEXT);
  const hits = []; while (walk.nextNode()) if (/[▲●]/.test(walk.currentNode.nodeValue)) hits.push(walk.currentNode);
  hits.forEach(n => { const span = document.createElement("span"); span.innerHTML = esc(n.nodeValue).replace(/▲/g, '<span class="mk trad" title="Traditionally read for career">▲</span>').replace(/●/g, '<span class="mk pers" title="Stands out in this chart">●</span>'); n.replaceWith(span); });
  const saved = store.get("ticks") || {};
  md.querySelectorAll('li input[type="checkbox"]').forEach((cb, i) => { cb.disabled = false; cb.id = "tick" + i; cb.checked = !!saved[i]; cb.closest("li").classList.add("task");
    cb.setAttribute("aria-label", "Done: " + cb.closest("li").textContent.trim().slice(0, 60));
    cb.onchange = () => { saved[i] = cb.checked; store.set("ticks", saved); }; });
  const hs = [...md.querySelectorAll("h2")];
  hs.forEach((h, i) => { h.id = "s" + i; });
  toc.innerHTML = `<span class="label" style="padding:0 10px 8px">Contents</span>` + hs.map((h, i) => `<a href="#s${i}" data-i="${i}">${esc(h.textContent)}</a>`).join("") +
    `<div class="legend"><span><span class="mk trad">▲</span> traditionally read for career</span><span><span class="mk pers">●</span> stands out in this chart</span><button class="linkbtn" type="button" id="toStart" style="text-align:left;padding:0">Take the questions</button></div>`;
  toc.querySelectorAll("a").forEach(a => a.onclick = e => { e.preventDefault(); $("#" + a.getAttribute("href").slice(1)).scrollIntoView({ behavior: "smooth" }); });
  $("#toStart").onclick = () => go(start);
  const links = [...toc.querySelectorAll("a")];
  const io = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) links.forEach(l => l.classList.toggle("cur", l.dataset.i === en.target.id.slice(1))); }), { rootMargin: "0px 0px -75% 0px" });
  hs.forEach(h => io.observe(h));
}

$("#home").onclick = e => { e.preventDefault(); go(start); };
$("#sampleLink").onclick = () => go(reading);
start();
})();
</script>
